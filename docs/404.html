<title>Not found</title>
<script>
/* GitHub Pages has no rewrites, so it serves this page for every missing path.
   Short Прегорело invites, /pregorelo/123456 and /pregorelo-dev/123456, go to the game with that code. */
(function(){
  var m=location.pathname.match(/^\/(pregorelo(?:-dev)?)\/(\d{6})\/?$/);
  if(m) location.replace('/'+m[1]+'/#igra='+m[2]);
})();
</script>
